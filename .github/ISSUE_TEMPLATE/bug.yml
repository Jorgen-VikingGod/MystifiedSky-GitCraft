name: Bug report
description: Report a reproducible problem in GitCraft.
labels: [bug]
body:
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Multiple platforms
        - Other or unsure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: GitCraft version, OS details, and Git version
      placeholder: Include the OS version, CPU architecture, and package format when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use the bundled sample or a disposable repository. Include any starting conditions, such as staged changes or an in-progress merge.
      placeholder: Number the steps and include the action or shortcut that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the visible error and any effects on the branch, staging area, working tree, or saved data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: If known, include how often it happens, the last version that worked, related issues, or sanitized logs and screenshots. Remove credentials, private repository URLs, and personal data before posting.
