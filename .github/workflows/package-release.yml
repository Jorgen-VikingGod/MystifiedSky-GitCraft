name: Package release

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      formats:
        required: true
        type: string
      version:
        required: true
        type: string
      sign:
        type: boolean
        default: true
    secrets:
      updater-key:
        required: false
      updater-password:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ inputs.platform }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libdbus-1-dev patchelf file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ inputs.target != 'universal-apple-darwin' && inputs.target || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ inputs.target }}
      - name: Set the package version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/set-version.mjs "$VERSION"
        shell: bash
      - name: Compile GitCraft
        if: inputs.target != 'universal-apple-darwin'
        shell: bash
        run: cargo build --release --locked -p gitcraft --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.target == 'universal-apple-darwin'
        with:
          pattern: macos-binary-*
          path: macos-binaries
      - name: Assemble the macOS universal executable
        if: inputs.target == 'universal-apple-darwin'
        shell: bash
        run: |
          output="target/$TARGET/release/gitcraft"
          mkdir -p "$(dirname "$output")"
          lipo -create -output "$output" \
            macos-binaries/macos-binary-aarch64-apple-darwin/gitcraft \
            macos-binaries/macos-binary-x86_64-apple-darwin/gitcraft
          chmod +x "$output"
          lipo "$output" -verify_arch arm64 x86_64
      - name: Install the packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Package installers and sign updates
        shell: bash
        env:
          FORMATS: ${{ inputs.formats }}
          # linuxdeploy uses SIGN to enable its own AppImage GPG signing.
          GITCRAFT_SIGN_UPDATES: ${{ inputs.sign }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ inputs.sign && secrets.updater-key || '' }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ inputs.sign && secrets.updater-password || '' }}
        run: |
          if [[ "$GITCRAFT_SIGN_UPDATES" == true && -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY. See RELEASING.md."
            exit 1
          fi
          if [[ "$GITCRAFT_SIGN_UPDATES" != true ]]; then
            unset CARGO_PACKAGER_SIGN_PRIVATE_KEY CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD
          fi
          # The packager reads the binary from target/<triple>/release, then changes into crates/gitcraft.
          out_dir="$PWD/target/$TARGET/release/bundle/packager"
          mkdir -p "$out_dir"
          cargo packager --release -p gitcraft --target "$TARGET" --formats "$FORMATS" --out-dir "$out_dir"
          if ! compgen -G "$out_dir/*" >/dev/null; then
            echo "::error::cargo packager left nothing in $out_dir."
            exit 1
          fi
      - name: Build the Linux RPM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install cargo-generate-rpm --locked --version 0.21.1
          # cargo-generate-rpm treats the output as a filename unless the directory exists.
          rpm_dir="target/$TARGET/release/bundle/rpm"
          mkdir -p "$rpm_dir"
          cargo generate-rpm -p crates/gitcraft --target "$TARGET" -o "$rpm_dir"
      - name: Verify the Windows MSI upgrade identity
        if: inputs.platform == 'windows'
        shell: pwsh
        run: ./scripts/check-msi-upgrade.ps1 -Directory "target/$env:TARGET/release/bundle/packager"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.platform }}
          path: |
            target/${{ inputs.target }}/release/bundle/*/*-setup.exe
            target/${{ inputs.target }}/release/bundle/*/*.msi
            target/${{ inputs.target }}/release/bundle/*/*.dmg
            target/${{ inputs.target }}/release/bundle/*/*.app.tar.gz
            target/${{ inputs.target }}/release/bundle/*/*.AppImage
            target/${{ inputs.target }}/release/bundle/*/*.deb
            target/${{ inputs.target }}/release/bundle/*/*.rpm
            target/${{ inputs.target }}/release/bundle/*/*.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
