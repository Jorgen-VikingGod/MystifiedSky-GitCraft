name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: GitHub release channel or macOS packaging dry run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
          - macos-dry-run
      highlights:
        description: Optional Markdown overview for the GitHub release
        required: false
        type: string

permissions:
  contents: read

# Keep preview and stable publication ordered.
concurrency:
  group: ${{ inputs.channel == 'macos-dry-run' && format('gitcraft-macos-dry-run-{0}', github.ref) || 'gitcraft-release' }}
  queue: max

jobs:
  tests:
    needs: version
    if: inputs.channel != 'macos-dry-run' && needs.version.outputs.tested != 'true'
    uses: ./.github/workflows/test.yml

  version:
    if: github.ref == 'refs/heads/main' || inputs.channel == 'macos-dry-run'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      number: ${{ steps.version.outputs.number }}
      tested: ${{ steps.tests.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Assign the build version
        id: version
        shell: bash
        run: |
          number=$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const cargo = readFileSync('Cargo.toml', 'utf8');
          const updates = readFileSync('crates/gitcraft-core/src/updates.rs', 'utf8');
          const pubkey = /pub const PUBLIC_KEY: &str = "([^"]+)";/.exec(updates)?.[1];
          const version = /^\[workspace\.package\]\r?\n(?:[^\[\r\n][^\r\n]*\r?\n)*?version = "([^"]+)"/m.exec(cargo)?.[1];
          const base = /^(\d+)\.(\d+)\.(\d+)$/.exec(version ?? '');
          if (!base || !pubkey) {
            throw new Error('Set a stable base version in Cargo.toml ([workspace.package]) and the update public key in crates/gitcraft-core/src/updates.rs.');
          }
          const patch = Number(base[3]) + Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isInteger(patch) || patch > 65535 || Number(base[1]) > 255 || Number(base[2]) > 255) {
            throw new Error('Release version exceeds Windows MSI version limits.');
          }
          console.log(`${base[1]}.${base[2]}.${patch}`);
          NODE
          )
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Reuse passing push tests for this commit
        id: tests
        if: inputs.channel != 'macos-dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs" \
              -f branch=main -f event=push -f "head_sha=$GITHUB_SHA" -F per_page=1 \
              --jq '.workflow_runs[0]') &&
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo and
              .event == "push" and .status == "completed" and .conclusion == "success"
            ' <<< "$run" >/dev/null; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "Using passing push CI from $(jq -r .html_url <<< "$run")."
          else
            echo "No passing push CI result for $GITHUB_SHA. Running the test matrix."
          fi

  release-ready:
    needs: [version, tests]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
          (needs.tests.result == 'success' ||
            (needs.tests.result == 'skipped' &&
              (needs.version.outputs.tested == 'true' || inputs.channel == 'macos-dry-run'))) }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Ready to build"

  build:
    needs: [version, release-ready]
    if: inputs.channel != 'macos-dry-run'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
          - runner: windows-11-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            formats: nsis
          - runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            formats: deb,appimage
    uses: ./.github/workflows/package-release.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      formats: ${{ matrix.formats }}
      version: ${{ needs.version.outputs.number }}
    secrets:
      updater-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      updater-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  macos-binaries:
    name: Compile macOS (${{ matrix.target }})
    needs: [version, release-ready]
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Compile GitCraft
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          node scripts/set-version.mjs "$VERSION"
          cargo build --release --locked -p gitcraft --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/gitcraft
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  macos:
    needs: [version, macos-binaries]
    uses: ./.github/workflows/package-release.yml
    with:
      runner: macos-latest
      platform: macos
      target: universal-apple-darwin
      formats: app,dmg
      version: ${{ needs.version.outputs.number }}
      sign: ${{ inputs.channel != 'macos-dry-run' }}
    secrets:
      updater-key: ${{ inputs.channel != 'macos-dry-run' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      updater-password: ${{ inputs.channel != 'macos-dry-run' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

  publish:
    needs: [version, build, macos]
    if: github.ref == 'refs/heads/main' && (inputs.channel == 'preview' || inputs.channel == 'stable')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: bundles
      - name: Install the update signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Prepare installers and the update manifest
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: node scripts/release-assets.mjs "$VERSION" "$GITHUB_REPOSITORY"
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.number }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_HIGHLIGHTS: ${{ inputs.highlights }}
        shell: bash
        run: |
          case "$CHANNEL" in
            preview)
              draft_flags=(--prerelease)
              channel_flags=(--prerelease --latest=false)
              rm release-assets/latest.json
              ;;
            stable)
              draft_flags=()
              channel_flags=(--prerelease=false --latest=true)
              ;;
            *)
              echo "::error::Unknown release channel."
              exit 1
              ;;
          esac
          tag="v$VERSION"
          if release=$(gh release view "$tag" --json isDraft,targetCommitish 2>/dev/null); then
            if [[ $(jq -r .targetCommitish <<<"$release") != "$GITHUB_SHA" ]]; then
              echo "::error::Release $tag already belongs to a different commit."
              exit 1
            fi
            if [[ $(jq -r .isDraft <<<"$release") != true ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          fi

          # Use a published tag as the baseline, even when several builds
          # started before main's changelog could be archived.
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          versions=$(printf '%s\n' "$published" "$tag" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu)
          newest=$(tail -n 1 <<<"$versions")
          if [[ "$newest" != "$tag" ]]; then
            echo "Skipping $tag because $newest is already published."
            exit 0
          fi
          previous=$(awk -v target="$tag" '$0 == target { print prev; exit } { prev = $0 }' <<<"$versions")
          baseline="$RUNNER_TEMP/previous-changelog.md"
          generated="$RUNNER_TEMP/generated-release-notes.md"
          note_fields=(-f "tag_name=$tag" -f "target_commitish=$GITHUB_SHA")
          : > "$baseline"
          if [[ -n "$previous" ]]; then
            note_fields+=(-f "previous_tag_name=$previous")
            git rev-parse --verify "refs/tags/$previous^{commit}" >/dev/null
            if git cat-file -e "refs/tags/$previous:CHANGELOG.md"; then
              git show "refs/tags/$previous:CHANGELOG.md" > "$baseline"
            fi
          fi
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${note_fields[@]}" \
            --jq '.body // ""' > "$generated"; then
            echo "::warning::Could not get GitHub contributor credits. Publishing the changelog and PR links."
            : > "$generated"
          fi
          node scripts/changelog-release.mjs publish-notes CHANGELOG.md "$baseline" \
            "$GITHUB_REPOSITORY" "$tag" "$previous" "$generated" > release-notes.md
          if [[ -n "${release:-}" ]]; then
            gh release edit "$tag" --notes-file release-notes.md
          else
            if ! created=$(gh release create "$tag" --draft --target "$GITHUB_SHA" --title "GitCraft $tag" --notes-file release-notes.md "${draft_flags[@]}" 2>&1); then
              printf '%s\n' "$created" >&2
              case "$created" in
                *'HTTP 403: Resource not accessible by integration'*|*'HTTP 404:'*) ;;
                *) exit 1 ;;
              esac
              # The workflow token cannot tag an older commit with different workflow files.
              git fetch --no-tags origin refs/heads/main
              if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows/; then
                exit 1
              else
                diff_status=$?
                [[ "$diff_status" == 1 ]] || exit "$diff_status"
              fi
              echo "::notice::Skipping $tag because main has a newer release workflow."
              exit 0
            fi
            printf '%s\n' "$created"
          fi
          gh release upload "$tag" release-assets/* --clobber

          gh release edit "$tag" --draft=false "${channel_flags[@]}"
