name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: GitHub release channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - stable
      highlights:
        description: Optional Markdown overview for the GitHub release
        required: false
        type: string

permissions:
  contents: read

# Keep preview and stable publication ordered.
concurrency:
  group: gitcraft-release
  queue: max

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml

  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Assign the build version
        id: version
        shell: bash
        run: |
          number=$(node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const cargo = readFileSync('Cargo.toml', 'utf8');
          const updates = readFileSync('crates/gitcraft-core/src/updates.rs', 'utf8');
          const pubkey = /pub const PUBLIC_KEY: &str = "([^"]+)";/.exec(updates)?.[1];
          const version = /^\[workspace\.package\]\r?\n(?:[^\[\r\n][^\r\n]*\r?\n)*?version = "([^"]+)"/m.exec(cargo)?.[1];
          const base = /^(\d+)\.(\d+)\.(\d+)$/.exec(version ?? '');
          if (!base || !pubkey) {
            throw new Error('Set a stable base version in Cargo.toml ([workspace.package]) and the update public key in crates/gitcraft-core/src/updates.rs.');
          }
          const patch = Number(base[3]) + Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isInteger(patch) || patch > 65535 || Number(base[1]) > 255 || Number(base[2]) > 255) {
            throw new Error('Release version exceeds Windows MSI version limits.');
          }
          console.log(`${base[1]}.${base[2]}.${patch}`);
          NODE
          )
          echo "number=$number" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            formats: nsis,wix
          - runner: windows-11-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            formats: nsis
          - runner: macos-latest
            platform: macos
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            formats: app,dmg
          - runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            formats: deb,appimage
            rpm: true
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            formats: deb,appimage
            rpm: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libdbus-1-dev patchelf file

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Third-party actions are pinned to a full commit hash, so a moved tag or branch can't change what runs in the
      # release build. To update: look up the new commit (for example `gh api repos/dtolnay/rust-toolchain/commits/stable`)
      # and change the hash and the comment together.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build installers and sign updates
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.number }}
          TARGET: ${{ matrix.target }}
          FORMATS: ${{ matrix.formats }}
          RPM: ${{ matrix.rpm }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY. See RELEASING.md."
            exit 1
          fi
          node scripts/set-version.mjs "$VERSION"
          cargo install cargo-packager --locked --version 0.11.8
          bin_dir="target/$TARGET/release"
          if [[ "$TARGET" == universal-apple-darwin ]]; then
            for arch in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --release --locked -p gitcraft --target "$arch"
            done
            mkdir -p "$bin_dir"
            lipo -create -output "$bin_dir/gitcraft" target/aarch64-apple-darwin/release/gitcraft target/x86_64-apple-darwin/release/gitcraft
          else
            cargo build --release --locked -p gitcraft --target "$TARGET"
          fi
          # cargo-packager 0.11.8 parses --binaries-dir without using it: --target is what points it
          # at target/<triple>/release. It also changes into crates/gitcraft before packaging, so the
          # output folder is made absolute here.
          out_dir="$PWD/$bin_dir/bundle/packager"
          mkdir -p "$out_dir"
          cargo packager --release -p gitcraft --target "$TARGET" --formats "$FORMATS" --out-dir "$out_dir"
          if ! compgen -G "$out_dir/*" >/dev/null; then
            echo "::error::cargo packager left nothing in $out_dir."
            exit 1
          fi
          # The packager makes no RPM packages.
          if [[ "$RPM" == true ]]; then
            cargo install cargo-generate-rpm --locked --version 0.21.1
            # cargo-generate-rpm treats the output as a filename unless the directory exists.
            rpm_dir="$bin_dir/bundle/rpm"
            mkdir -p "$rpm_dir"
            cargo generate-rpm -p crates/gitcraft --target "$TARGET" -o "$rpm_dir"
          fi

      - name: Verify the Windows MSI upgrade identity
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/check-msi-upgrade.ps1 -Directory "target/${{ matrix.target }}/release/bundle/packager"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/bundle/*/*-setup.exe
            target/${{ matrix.target }}/release/bundle/*/*.msi
            target/${{ matrix.target }}/release/bundle/*/*.dmg
            target/${{ matrix.target }}/release/bundle/*/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/*/*.AppImage
            target/${{ matrix.target }}/release/bundle/*/*.deb
            target/${{ matrix.target }}/release/bundle/*/*.rpm
            target/${{ matrix.target }}/release/bundle/*/*.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: [version, build, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: bundles
      - name: Prepare installers and the update manifest
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: node scripts/release-assets.mjs "$VERSION" "$GITHUB_REPOSITORY"
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.number }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_HIGHLIGHTS: ${{ inputs.highlights }}
        shell: bash
        run: |
          case "$CHANNEL" in
            preview)
              draft_flags=(--prerelease)
              channel_flags=(--prerelease --latest=false)
              rm release-assets/latest.json
              ;;
            stable)
              draft_flags=()
              channel_flags=(--prerelease=false --latest=true)
              ;;
            *)
              echo "::error::Unknown release channel."
              exit 1
              ;;
          esac
          tag="v$VERSION"
          if release=$(gh release view "$tag" --json isDraft,targetCommitish 2>/dev/null); then
            if [[ $(jq -r .targetCommitish <<<"$release") != "$GITHUB_SHA" ]]; then
              echo "::error::Release $tag already belongs to a different commit."
              exit 1
            fi
            if [[ $(jq -r .isDraft <<<"$release") != true ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          fi

          # Use a published tag as the baseline, even when several builds
          # started before main's changelog could be archived.
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          versions=$(printf '%s\n' "$published" "$tag" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu)
          newest=$(tail -n 1 <<<"$versions")
          if [[ "$newest" != "$tag" ]]; then
            echo "Skipping $tag because $newest is already published."
            exit 0
          fi
          previous=$(awk -v target="$tag" '$0 == target { print prev; exit } { prev = $0 }' <<<"$versions")
          baseline="$RUNNER_TEMP/previous-changelog.md"
          generated="$RUNNER_TEMP/generated-release-notes.md"
          note_fields=(-f "tag_name=$tag" -f "target_commitish=$GITHUB_SHA")
          : > "$baseline"
          if [[ -n "$previous" ]]; then
            note_fields+=(-f "previous_tag_name=$previous")
            git rev-parse --verify "refs/tags/$previous^{commit}" >/dev/null
            if git cat-file -e "refs/tags/$previous:CHANGELOG.md"; then
              git show "refs/tags/$previous:CHANGELOG.md" > "$baseline"
            fi
          fi
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${note_fields[@]}" \
            --jq '.body // ""' > "$generated"; then
            echo "::warning::Could not get GitHub contributor credits. Publishing the changelog and PR links."
            : > "$generated"
          fi
          node scripts/changelog-release.mjs publish-notes CHANGELOG.md "$baseline" \
            "$GITHUB_REPOSITORY" "$tag" "$previous" "$generated" > release-notes.md
          if [[ -n "${release:-}" ]]; then
            gh release edit "$tag" --notes-file release-notes.md
          else
            if ! created=$(gh release create "$tag" --draft --target "$GITHUB_SHA" --title "GitCraft $tag" --notes-file release-notes.md "${draft_flags[@]}" 2>&1); then
              printf '%s\n' "$created" >&2
              case "$created" in
                *'HTTP 403: Resource not accessible by integration'*|*'HTTP 404:'*) ;;
                *) exit 1 ;;
              esac
              # The workflow token cannot tag an older commit with different workflow files.
              git fetch --no-tags origin refs/heads/main
              if git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows/; then
                exit 1
              else
                diff_status=$?
                [[ "$diff_status" == 1 ]] || exit "$diff_status"
              fi
              echo "::notice::Skipping $tag because main has a newer release workflow."
              exit 0
            fi
            printf '%s\n' "$created"
          fi
          gh release upload "$tag" release-assets/* --clobber

          gh release edit "$tag" --draft=false "${channel_flags[@]}"
