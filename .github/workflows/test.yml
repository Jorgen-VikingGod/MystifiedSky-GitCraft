name: Tests

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitcraft-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: Windows
          - runner: ubuntu-22.04
            platform: Linux
          - runner: macos-latest
            platform: macOS
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-${{ matrix.runner }}
      - name: Install frontend dependencies
        run: npm --prefix ui ci --ignore-scripts
      - name: Build and typecheck the frontend
        run: npm --prefix ui run build
      - name: Test the frontend
        run: npm --prefix ui test
      - name: Test release notes
        run: node --test scripts/changelog-release.test.mjs
      - name: Test browser protocol dispatch
        run: node --test scripts/cdp-messages.test.mjs
      - name: Test desktop harness path boundaries
        run: node --test scripts/desktop-harness-paths.test.mjs
      - name: Check Rust lints
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D clippy::correctness
      - name: Audit npm dependencies
        if: runner.os == 'Linux'
        run: npm --prefix ui audit --audit-level=high
      - name: Audit Cargo dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Test native Git operations
        run: cargo test --locked -- --test-threads=1

  browser:
    name: Headless browser regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
      - run: npm --prefix ui ci --ignore-scripts
      - name: Exercise components and resource budgets
        run: node scripts/verify-browser.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regressions
          path: target/verification/
          if-no-files-found: warn
