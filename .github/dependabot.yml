version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-patches:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      action-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
