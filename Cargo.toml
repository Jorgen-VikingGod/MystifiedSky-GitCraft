[package]
name = "gitcraft"
version = "0.1.0"
edition = "2021"
description = "GitCraft - a graphical Git client"
license = "GPL-3.0-only"

[[bin]]
name = "gitcraft"
path = "src/main.rs"

[features]
verification = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
rfd = "0.18"
notify-debouncer-mini = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
encoding_rs = "0.8"
regex = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
  "Win32_System_JobObjects", "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Registry",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Stable Tauri's GTK3 bindings still require glib 0.18. Keep the released API and
# backport the upstream VariantStrIter soundness fix until that constraint changes.
[patch.crates-io]
glib = { path = "vendor/glib" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSObject", "NSString", "NSURL", "NSEnumerator"] }
